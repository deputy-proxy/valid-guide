name: test-debug

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup application
        run: composer setup

      - name: Run relevant tests
        continue-on-error: true
        run: php artisan test tests/Feature/AuditorConflictDeclarationTest.php > test.txt 2>&1

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conflict-test-diagnostics
          path: test.txt
