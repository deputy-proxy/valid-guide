name: pint-debug

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  pint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        file:
          - app/Services/AuditorAssignmentAccess.php
          - app/Services/AuditorConflictDeclarationService.php
          - app/Services/AuditorEligibility.php
          - app/Services/AuditorProfileManagement.php
          - app/Filament/Auditor/Pages/AnnualConflictDeclaration.php
          - app/Filament/Auditor/Pages/Assignment.php
          - app/Filament/Auditor/Pages/Profile.php
          - tests/Feature/AuditorConflictDeclarationTest.php
          - tests/Feature/AuditorEligibilityTest.php
          - tests/Feature/AuditorOnboardingPagesTest.php
          - tests/Feature/AuditorProfileManagementTest.php
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup application
        run: composer install --no-interaction --prefer-dist

      - name: Check Pint
        run: vendor/bin/pint --test "${{ matrix.file }}"
