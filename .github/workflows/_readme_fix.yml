name: README Fix
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('README.md')
          s=p.read_text()
          s=s.replace('- resolve the current CI/style and dependency-lock issues', '- maintain the now-green PHPStan/CI quality gate and keep static types explicit as the domain expands')
          if '## Static Analysis' not in s:
              s += '\n\n## Static Analysis\n\nPHPStan is a CI quality gate. Eloquent models explicitly document relationship generics, factory generics, enum/date casts and relevant value shapes so domain services receive concrete types. Single-record workflows use single-record query operations where appropriate. PHPStan failures are treated as implementation defects rather than globally suppressed.\n'
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'Update README after CI repair'
          git push
