name: pint-debug

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  pint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - file: app/Services/AuditorProfileManagement.php
            name: auditor-profile-management
          - file: app/Services/AuditorEligibility.php
            name: auditor-eligibility
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup application
        run: composer install --no-interaction --prefer-dist

      - name: Apply Pint
        run: vendor/bin/pint "${{ matrix.file }}"

      - name: Capture diff
        run: git diff --no-ext-diff -- "${{ matrix.file }}" > pint.diff

      - name: Upload diff
        uses: actions/upload-artifact@v4
        with:
          name: pint-diff-${{ matrix.name }}
          path: pint.diff
